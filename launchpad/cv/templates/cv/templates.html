{% extends 'layout.html' %}
{% load static %}
{% block title%} CV Templates {% endblock %}
{% block content%}
<div class="templatepage-selection">
    <h1>Choose Your CV Template</h1>
    <div class="template-previews">
        <div class="filter-dropdowns">

            <select class="filter-dropdown">
                <option value="">Select Category</option>
                <option value="professional">Professional</option>
                <option value="creative">Creative</option>
                <option value="modern">Modern</option>
            </select>
    
            <select class="filter-dropdown">
                <option value="">Select Color</option>
                <option value="blue">Blue</option>
                <option value="green">Green</option>
                <option value="red">Red</option>
            </select>
    
            <select class="filter-dropdown">
                <option value="">Select Layout</option>
                <option value="single-column">Single Column</option>
                <option value="two-column">Two Column</option>
                <option value="three-column">Three Column</option>
            </select>

               <select class="filter-dropdown">
                <option value="">Select Layout</option>
                <option value="single-column">Single Column</option>
                <option value="two-column">Two Column</option>
                <option value="three-column">Three Column</option>
            </select>
        </div>
    </div>
    <div class="template-grid">
        <!-- Template 1 -->
        <div class="template-card">
            <img src="{% static 'images/template1.png' %}" alt="Template 1 Preview" class="template-preview-img">
            <h3>Template</h3>
            <button class="use-template-btn">Use Template</button>
        </div>

        <!-- Template 2 -->
        <div class="template-card">
            <img src="{% static 'images/template2.png' %}" alt="Template 2 Preview" class="template-preview-img">
            <h3>Template</h3>
            <button class="use-template-btn">Use Template</button>
        </div>

        <!-- Template 3 -->
        <div class="template-card">
            <img src="{% static 'images/template3.png' %}" alt="Template 3 Preview" class="template-preview-img">
            <h3>Template</h3>
            <button class="use-template-btn">Use Template</button>
        </div>

        <!-- Template 4 -->
        <div class="template-card">
            <img src="{% static 'images/template4.png' %}" alt="Template 4 Preview" class="template-preview-img">
            <h3>Template</h3>
            <button class="use-template-btn">Use Template</button>
        </div>
    </div>
</div>
{% endblock%}
