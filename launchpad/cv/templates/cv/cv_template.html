<header class="bg-slate-800 text-white p-8">
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
        <div>
            <!-- 👇 Since first_name is absent, display their account email as a prominent title fallback -->
            <h1 class="text-3xl font-extrabold tracking-wide uppercase">
                {{ profile.user.email }}
            </h1>
            <p class="text-slate-400 font-medium mt-1">Professional Curriculum Vitae</p>
        </div>
        <div class="text-sm space-y-1 text-slate-300">
            <p>✉️ {{ profile.user.email }}</p>
            <p>📞 {{ profile.phone }}</p>
        </div>
    </div>
</header>
